<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Guardian Eye — Statistics</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/static/i18n.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.header{background:#1e293b;padding:16px 24px;border-bottom:2px solid #3b82f6;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.header h1{font-size:20px}
.header .actions{display:flex;gap:8px;align-items:center}
.btn{padding:9px 14px;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;text-decoration:none;color:white}
.btn-primary{background:#3b82f6}
.btn-danger{background:#ef4444}
select#langSwitcher{padding:9px 12px;border-radius:8px;border:1px solid #475569;background:#0f172a;color:#e2e8f0;font-size:13px;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px;padding:20px 24px}
.stat-card{background:#1e293b;border-radius:12px;padding:18px;border-right:4px solid #3b82f6}
.stat-card.alert{border-right-color:#ef4444}
.stat-card.success{border-right-color:#22c55e}
.stat-card.warning{border-right-color:#f59e0b}
.stat-label{font-size:12px;color:#94a3b8;margin-bottom:6px}
.stat-value{font-size:26px;font-weight:700;color:#f8fafc}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:0 24px 24px}
@media(max-width:1024px){.charts{grid-template-columns:1fr}}
.chart-card{background:#1e293b;border-radius:12px;padding:20px}
.chart-card h3{color:#f8fafc;margin-bottom:15px;font-size:15px}
.chart-container{height:300px;position:relative}
</style>
</head>
<body>
<div class="header">
<div style="display:flex;align-items:center;gap:10px">
    <div class="guardian-eye" title="Guardian Eye is watching">
        <div class="eye-ball"><div class="eye-pupil"></div></div>
    </div>
    <div>
        <div style="font-size:16px;font-weight:800;letter-spacing:1px;color:#f8fafc">GUARDIAN EYE</div>
        <div style="font-size:10px;color:#94a3b8;letter-spacing:0.5px;margin-top:-2px">AI-POWERED RETAIL SECURITY</div>
    </div>
</div>
</div>
<div class="actions">
<select id="langSwitcher">
<option value="ar">العربية</option>
<option value="en">English</option>
<option value="fr">Français</option>
</select>
<a href="/dashboard" class="btn btn-primary" data-i18n="back_dashboard">← لوحة التحكم</a>
<a href="/logout" class="btn btn-danger" data-i18n="logout">خروج</a>
</div>
</div>
<div class="stats">
<div class="stat-card alert"><div class="stat-label" data-i18n="total_events">إجمالي الأحداث</div><div class="stat-value" id="sTotal">-</div></div>
<div class="stat-card warning"><div class="stat-label" data-i18n="unique_tracks">أشخاص فريدون</div><div class="stat-value" id="sTracks">-</div></div>
<div class="stat-card success"><div class="stat-label" data-i18n="recurring_visitors">زوار متكررون</div><div class="stat-value" id="sRecurring">-</div></div>
<div class="stat-card"><div class="stat-label" data-i18n="behavior_types">أنواع السلوك</div><div class="stat-value" id="sReasons">-</div></div>
</div>
<div class="charts">
<div class="chart-card"><h3 data-i18n="chart_hourly">⏰ الأحداث حسب الساعة</h3><div class="chart-container"><canvas id="hourlyChart"></canvas></div></div>
<div class="chart-card"><h3 data-i18n="chart_reasons">⚠️ توزيع أنواع السلوك</h3><div class="chart-container"><canvas id="reasonsChart"></canvas></div></div>
<div class="chart-card"><h3 data-i18n="chart_tracks">👤 أكثر 5 أشخاص</h3><div class="chart-container"><canvas id="tracksChart"></canvas></div></div>
<div class="chart-card"><h3 data-i18n="chart_summary">📈 ملخص</h3><div class="chart-container" style="display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px">
<p style="color:#94a3b8;text-align:center;font-size:13px" data-i18n="chart_hint">يتم تحديث الإحصائيات عند كل زيارة.</p>
<button class="btn btn-primary" onclick="loadStats()" data-i18n="refresh_now">🔄 تحديث الآن</button>
</div></div>
</div>
<script>
let charts = {};
let currentLang = localStorage.getItem('guardian_lang') || 'ar';

function t(key) {
    const TRANSLATIONS = window.TRANSLATIONS || {};
    return (TRANSLATIONS[currentLang] && TRANSLATIONS[currentLang][key]) || key;
}

const chartOpts = () => ({
    responsive: true,
    maintainAspectRatio: false,
    plugins: { legend: { labels: { color: '#e2e8f0' } } },
    scales: { x: { ticks: { color: '#94a3b8' } }, y: { ticks: { color: '#94a3b8' } } }
});

async function loadStats() {
    const r = await fetch('/api/analytics');
    const data = await r.json();
    document.getElementById('sTotal').textContent = data.total;
    document.getElementById('sTracks').textContent = data.unique_tracks;
    document.getElementById('sRecurring').textContent = data.recurring;
    document.getElementById('sReasons').textContent = Object.keys(data.reasons).length;

    const hours = Object.keys(data.hourly).sort();
    if (charts.hourly) charts.hourly.destroy();
    charts.hourly = new Chart(document.getElementById('hourlyChart'), {
        type: 'line',
        data: { labels: hours, datasets: [{ label: t('events_unit'), data: hours.map(h => data.hourly[h]), borderColor: '#3b82f6', backgroundColor: 'rgba(59,130,246,0.2)', tension: 0.3, fill: true }] },
        options: chartOpts()
    });

    const reasons = Object.keys(data.reasons);
    const colors = ['#ef4444','#f59e0b','#10b981','#3b82f6','#8b5cf6','#ec4899'];
    if (charts.reasons) charts.reasons.destroy();
    charts.reasons = new Chart(document.getElementById('reasonsChart'), {
        type: 'doughnut',
        data: { labels: reasons, datasets: [{ data: reasons.map(r => data.reasons[r]), backgroundColor: colors.slice(0, reasons.length) }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#e2e8f0' } } } }
    });

    const tracks = data.top_tracks.map(t => 'Track #' + t.track_id);
    if (charts.tracks) charts.tracks.destroy();
    charts.tracks = new Chart(document.getElementById('tracksChart'), {
        type: 'bar',
        data: { labels: tracks, datasets: [{ label: t('events_unit'), data: data.top_tracks.map(t => t.count), backgroundColor: '#ef4444' }] },
        options: chartOpts()
    });
}

function applyStatsLanguage(lang) {
    currentLang = lang;
    localStorage.setItem('guardian_lang', lang);
    document.documentElement.lang = lang;
    document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-i18n]').forEach(el => {
        el.textContent = t(el.dataset.i18n);
    });
    loadStats();
}

window.addEventListener('load', () => {
    const sel = document.getElementById('langSwitcher');
    if (sel) {
        sel.value = currentLang;
        sel.addEventListener('change', (e) => applyStatsLanguage(e.target.value));
    }
    applyStatsLanguage(currentLang);
});
</script>

    <footer style="text-align:center;padding:14px;color:#64748b;font-size:11px;border-top:1px solid #334155;margin-top:20px">
        © 2026 Guardian Eye — عين لا تنام. حارس لا يخطئ.
    </footer>
</body>
</html>
